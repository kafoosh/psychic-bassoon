<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>A Little Guy</title>
  <script>
    // URL force: "/7D" or "?=7D". ANYTHING may follow the card ("/7D90$38/2#x?y" works): the
    // first path segment (or the query) that starts with a card is read, and everything from
    // there on is junk. The address is then reset to the bare site BEFORE first paint, so only
    // the plain address shows. Values A 2–10 J Q K, suits C H S D, either case. Handed to
    // src/main.js via __lgForce. The "/7D" form works because the deploy also publishes this
    // page as 404.html, which GitHub Pages serves for any path without a file. (GitHub itself
    // rejects addresses containing "%" or ";", so those can't be used in the junk.)
    (function () {
      var card = /^(10|[2-9]|[ajqk])([chsd])/i;
      var base = location.pathname, m = null;
      var segs = location.pathname.split('/');
      for (var i = 1; i < segs.length && !m; i++) {          // the path comes first in the address
        var seg = segs[i];
        try { seg = decodeURIComponent(seg); } catch (e) {}
        if (card.test(seg)) { m = card.exec(seg); base = segs.slice(0, i).join('/') + '/'; }
      }
      var q = location.search.replace(/^\?=?/, '');
      if (!m && location.search && card.test(q)) m = card.exec(q);
      if (!m) return;
      var v = m[1].toUpperCase();
      var value = v === 'A' ? 1 : v === 'J' ? 11 : v === 'Q' ? 12 : v === 'K' ? 13 : parseInt(v, 10);
      var suit = { C: 'clubs', H: 'hearts', S: 'spades', D: 'diamonds' }[m[2].toUpperCase()];
      window.__lgForce = { value: value, suit: suit };
      // Keep only the debug flags (?routine=, ?demo=); every other character was junk.
      var keep = [];
      location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
        if (/^(routine|demo)=/.test(kv)) keep.push(kv);
      });
      try { history.replaceState(null, '', base + (keep.length ? '?' + keep.join('&') : '')); } catch (e) {}
    })();
  </script>
  <meta name="description" content="Draw a little guy.">
  <meta name="theme-color" content="#FBF6EA">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Little Guy">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preload" href="fonts/GochiHand-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="paper" aria-hidden="true"></canvas>
  <div id="catcher" aria-hidden="true"></div>
  <canvas id="ink" aria-label="Drawing"></canvas>
  <canvas id="stage" aria-hidden="true"></canvas>

  <header id="toolbar">
    <div id="suit-row" class="row"></div>
    <div id="draw-row" class="row" hidden></div>
    <div id="ribbon" role="button" aria-label="Draw a little guy"><span class="sticker-back"></span><span class="sticker-face">DRAW A LITTLE GUY</span></div>
  </header>

  <div id="menu-scrim" hidden></div>
  <div id="menu" role="menu" hidden>
    <span class="sticker-back"></span>
    <div class="sticker-face">
      <button id="menu-new-page" role="menuitem" type="button"><span>New Page</span><span class="menu-icon"></span></button>
    </div>
  </div>

  <div id="picker-scrim" hidden></div>
  <div id="picker" role="dialog" aria-label="Colours">
    <span class="sticker-back"></span>
    <div id="swatch-grid"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <button id="info" type="button" aria-label="About">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="9.4"/><g id="info-glyph"><line x1="12" y1="11" x2="12" y2="16.5" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1" fill="currentColor" stroke="none"/></g>
    </svg>
  </button>
  <div id="info-card">
    <b>Draw a little guy!</b><br>
    A webapp by oddpaq
  </div>

  <div id="safe-probe" aria-hidden="true"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
