<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>A Little Guy</title>
  <meta name="description" content="Draw a little guy.">
  <meta name="theme-color" content="#FBF6EA">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="A Little Guy">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preload" href="fonts/GochiHand-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="paper" aria-hidden="true"></canvas>
  <div id="catcher" aria-hidden="true"></div>
  <canvas id="ink" aria-label="Drawing"></canvas>
  <canvas id="stage" aria-hidden="true"></canvas>

  <header id="toolbar">
    <div id="suit-row" class="row"></div>
    <div id="draw-row" class="row" hidden></div>
    <div id="ribbon" role="button" aria-label="Draw a little guy"><span class="sticker-back"></span><span class="sticker-face">DRAW A LITTLE GUY</span></div>
  </header>

  <div id="menu-scrim" hidden></div>
  <div id="menu" role="menu" hidden>
    <span class="sticker-back"></span>
    <div class="sticker-face">
      <button id="menu-new-page" role="menuitem" type="button"><span>New Page</span><span class="menu-icon"></span></button>
    </div>
  </div>

  <div id="safe-probe" aria-hidden="true"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
